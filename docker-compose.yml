services:
  mongodb:
    image: mongo:7.0
    container_name: ai_calling_mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_calling
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { const s = rs.status(); if (s.ok) quit(0); } catch(e) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); quit(0); } catch(err) { quit(1); } }"
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s

  redis:
    image: redis:7-alpine
    container_name: ai_calling_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_calling_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LOG_LEVEL=debug
      - DATABASE_URL=mongodb://mongodb:27017/ai_calling?replicaSet=rs0&directConnection=true
      - REDIS_URL=redis://redis:6379
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - TWILIO_VALIDATE_WEBHOOK=${TWILIO_VALIDATE_WEBHOOK:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-realtime}
      - OPENAI_VOICE=${OPENAI_VOICE:-alloy}
      - MAX_CONCURRENT_CALLS=${MAX_CONCURRENT_CALLS:-5}
      - CALLS_PER_MINUTE=${CALLS_PER_MINUTE:-10}
      - CSR_PHONE_NUMBER=${CSR_PHONE_NUMBER:-+15559876543}
      - COMPANY_NAME=${COMPANY_NAME:-Zop Dealer}
      - ENABLE_CALL_RECORDING=${ENABLE_CALL_RECORDING:-false}
      - ENABLE_AMD=${ENABLE_AMD:-false}
      - ENABLE_WEEKLY_CHECKIN=${ENABLE_WEEKLY_CHECKIN:-true}
      - WEEKLY_CHECKIN_DAY=${WEEKLY_CHECKIN_DAY:-MONDAY}
      - WEEKLY_CHECKIN_TIME=${WEEKLY_CHECKIN_TIME:-10:00}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./.env:/app/.env

    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
